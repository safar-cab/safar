  <!-- Text: Safar -->
  <text x="82" y="54" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#0F172A" letter-spacing="-1.5">Safar</text>
