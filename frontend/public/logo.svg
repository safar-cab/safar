<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="road" x1="100" y1="380" x2="420" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="pin" x1="350" y1="100" x2="380" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <line x1="0" y1="170" x2="512" y2="170" stroke="white" stroke-width="0.5" opacity="0.06"/>
  <line x1="0" y1="340" x2="512" y2="340" stroke="white" stroke-width="0.5" opacity="0.06"/>
  <line x1="170" y1="0" x2="170" y2="512" stroke="white" stroke-width="0.5" opacity="0.06"/>
  <line x1="340" y1="0" x2="340" y2="512" stroke="white" stroke-width="0.5" opacity="0.06"/>

  <!-- Curved road/journey path -->
  <path d="M80 380 C140 320 180 280 220 270 C280 255 320 290 360 220 C380 185 400 155 430 130"
        stroke="url(#road)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#shadow)"/>

  <!-- Road dashes (center line) -->
  <path d="M100 368 C155 312 190 275 225 265 C275 252 315 282 352 218 C370 188 390 160 415 140"
        stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 10" fill="none" opacity="0.5"/>

  <!-- Starting dot -->
  <circle cx="80" cy="380" r="14" fill="white" opacity="0.9"/>
  <circle cx="80" cy="380" r="7" fill="#2563EB"/>

  <!-- Destination pin -->
  <g filter="url(#shadow)">
    <path d="M430 130 C430 108 412 90 395 90 C378 90 360 108 360 130 C360 156 395 185 395 185 C395 185 430 156 430 130Z"
          fill="url(#pin)"/>
    <circle cx="395" cy="127" r="12" fill="white"/>
    <circle cx="395" cy="127" r="6" fill="#2563EB"/>
  </g>

  <!-- Car silhouette on road -->
  <g transform="translate(230, 235) rotate(-20)" filter="url(#shadow)">
    <!-- Car body -->
    <rect x="0" y="8" width="70" height="28" rx="8" fill="white"/>
    <!-- Car roof -->
    <path d="M12 8 L22 -8 H48 L58 8" fill="white"/>
    <!-- Front window -->
    <path d="M42 8 L48 -4 H46 L40 8Z" fill="#2563EB" opacity="0.4"/>
    <!-- Rear window -->
    <path d="M24 8 L22 -4 H28 L30 8Z" fill="#2563EB" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="18" cy="38" r="8" fill="#1E3A8A"/>
    <circle cx="18" cy="38" r="4" fill="white"/>
    <circle cx="52" cy="38" r="8" fill="#1E3A8A"/>
    <circle cx="52" cy="38" r="4" fill="white"/>
    <!-- Headlight -->
    <rect x="62" y="14" width="6" height="5" rx="2" fill="#FCD34D" opacity="0.8"/>
  </g>

  <!-- Motion lines behind car -->
  <g opacity="0.4">
    <line x1="170" y1="268" x2="200" y2="258" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="165" y1="280" x2="195" y2="270" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="175" y1="292" x2="198" y2="284" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- "S" letter hint in road curve (subtle branding) -->
</svg>
